			<form id="clubForm" class="box clubForm create" onsubmit="return createClub()">
				<label for="name">Club name</label>
				<input type="text" id="name" maxlength="100">
				<label>Tags (pick at least one)</label>
				<!-- clubform.js puts one checkbox per tag here -->
				<div id="tagChoices" class="tagChoices"></div>
				<label for="clubDescription">Description</label>
				<textarea id="clubDescription" maxlength="2000" placeholder="What does your club do?"></textarea>
				<label for="requirement">Requirement to join (leave empty if none)</label>
				<input type="text" id="requirement" maxlength="200" placeholder="Example: audition">
				<label for="contactEmail">Contact email (optional)</label>
				<input type="email" id="contactEmail" maxlength="100">
				<button type="submit">Create club</button>
			</form>
